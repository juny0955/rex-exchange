syntax = "proto3";

package engine.v1;

service MatchingEngineService {
    rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
    rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
    rpc AmendOrder(AmendOrderRequest) returns (AmendOrderResponse);

    // 여러 명령을 한 RPC로 묶어 콜당 고정비(HTTP/2 스트림/HPACK/응답 인코드)를 분산한다.
    // commands 순서대로 dispatch하므로 한 워크로드 unit 내부 의존성(place→cancel/amend)이 보존된다.
    rpc SubmitBatch(SubmitBatchRequest) returns (SubmitBatchResponse);
}

enum Side {
    SIDE_UNSPECIFIED = 0;
    SIDE_BUY = 1;
    SIDE_SELL = 2;
}

enum OrderType {
    ORDER_TYPE_UNSPECIFIED = 0;
    ORDER_TYPE_LIMIT = 1;
    ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
    TIME_IN_FORCE_UNSPECIFIED = 0;
    TIME_IN_FORCE_GTC = 1;
    TIME_IN_FORCE_IOC = 2;
    TIME_IN_FORCE_FOK = 3;
}

enum SubmitStatus {
    SUBMIT_STATUS_UNSPECIFIED = 0;
    SUBMIT_STATUS_SUBMITTED = 1;
    SUBMIT_STATUS_REJECTED = 2;
    SUBMIT_STATUS_RESOURCE_EXHAUSTED = 3;
}

message PlaceOrderRequest {
    string order_id = 1;
    string symbol = 2;

    Side side = 3;
    OrderType order_type = 4;
    TimeInForce tif = 5;

    optional string price = 6;

    oneof size {
        string base_qty = 7;
        string quote_qty = 8;
    }
}

message PlaceOrderResponse {
    string order_id = 1;
    SubmitStatus status = 2;
    string message = 3;
}

message CancelOrderRequest {
    string order_id = 1;
    string symbol = 2;
}

message CancelOrderResponse {
    string order_id = 1;
    SubmitStatus status = 2;
    string message = 3;
}

message AmendOrderRequest {
    string order_id = 1;
    string symbol = 2;
    optional string new_price = 3;
    optional string new_base_qty = 4;
}

message AmendOrderResponse {
    string order_id = 1;
    SubmitStatus status = 2;
    string message = 3;
}

message Command {
    oneof command {
        PlaceOrderRequest place = 1;
        CancelOrderRequest cancel = 2;
        AmendOrderRequest amend = 3;
    }
}

message SubmitBatchRequest {
    repeated Command commands = 1;
}

message CommandResult {
    string order_id = 1;
    SubmitStatus status = 2;
    string message = 3;
}

message SubmitBatchResponse {
    repeated CommandResult results = 1;
}
