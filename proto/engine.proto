syntax = "proto3";

package engine.v1;

service MatchingEngineService {
    rpc PlaceOrder(PlaceOrderRequest) returns (CommandAck);
    rpc CancelOrder(CancelOrderRequest) returns (CommandAck);
    rpc AmendOrder(AmendOrderRequest) returns (CommandAck);

    // 여러 명령을 한 RPC로 묶어 콜당 고정비(HTTP/2 스트림/HPACK/응답 인코드)를 분산한다.
    // commands 순서대로 dispatch하므로 한 워크로드 unit 내부 의존성(place→cancel/amend)이 보존된다.
    rpc SubmitBatch(SubmitBatchRequest) returns (SubmitBatchResponse);
}

enum Side {
    SIDE_UNSPECIFIED = 0;
    SIDE_BUY = 1;
    SIDE_SELL = 2;
}

enum OrderType {
    ORDER_TYPE_UNSPECIFIED = 0;
    ORDER_TYPE_LIMIT = 1;
    ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
    TIME_IN_FORCE_UNSPECIFIED = 0;
    TIME_IN_FORCE_GTC = 1;
    TIME_IN_FORCE_IOC = 2;
    TIME_IN_FORCE_FOK = 3;
}

message PlaceOrderRequest {
    string command_id = 1;
    string order_id = 2;
    string symbol = 3;

    Side side = 4;
    OrderType order_type = 5;
    TimeInForce tif = 6;

    optional string price = 7;

    oneof size {
        string base_qty = 8;
        string quote_qty = 9;
    }
}

message CancelOrderRequest {
    string command_id = 1;
    string order_id = 2;
    string symbol = 3;
}

message AmendOrderRequest {
    string command_id = 1;
    string order_id = 2;
    string symbol = 3;
    optional string new_price = 4;
    optional string new_base_qty = 5;
}

enum AckStatus {
    ACK_STATUS_UNSPECIFIED = 0;
    ACK_STATUS_ACCEPTED = 1;
    ACK_STATUS_REJECTED = 2;
    ACK_STATUS_RESOURCE_EXHAUSTED = 3;
    ACK_STATUS_UNAVAILABLE = 4;
}

enum AckReason {
    ACK_REASON_UNSPECIFIED = 0;
    ACK_REASON_ACCEPTED = 1;
    ACK_REASON_INVALID_ARGUMENT = 2;
    ACK_REASON_UNKNOWN_SYMBOL = 3;
    ACK_REASON_DUPLICATE_ORDER_ID = 4;
    ACK_REASON_ENGINE_CHANNEL_FULL = 5;
    ACK_REASON_ENGINE_STOPPED = 6;
    ACK_REASON_PUBLISHER_UNHEALTHY = 7;
}

message CommandAck {
    string command_id = 1;
    string order_id = 2;
    string symbol = 3;
    AckStatus status = 4;
    AckReason reason = 5;
    bool retryable = 6;
    string accepted_at = 7;
    string detail = 8;
}

message Command {
    oneof command {
        PlaceOrderRequest place = 1;
        CancelOrderRequest cancel = 2;
        AmendOrderRequest amend = 3;
    }
}

message SubmitBatchRequest {
    repeated Command commands = 1;
}

message SubmitBatchResponse {
    repeated CommandAck acks = 1;
}
