[package]
name = "matching-engine"
version = "0.1.0"
edition = "2024"
autobenches = false

[features]
bench-internals = []

[dependencies]
# Runtime
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal"] }

# gRPC
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
prost = "0.14.3"

rdkafka = { version = "0.39.0", features = ["cmake-build", "tracing"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

rust_decimal = "1.42.0"
uuid = { version = "1.23.2", features = ["v7"] }
crossbeam = "0.8.4"
chrono = "0.4.45"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "orderbook"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "matching-engine"
harness = false
required-features = ["bench-internals"]
